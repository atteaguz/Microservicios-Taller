Server:
  port: 8080

spring:
  application:
    name: api.gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ms-usuarios
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios/**
            - id: ms-productos
              uri: http://localhost:8082
              predicates:
                - Path=/api/productos/**

logging:
  level:
    org.springframework.cloud.gateway: debug