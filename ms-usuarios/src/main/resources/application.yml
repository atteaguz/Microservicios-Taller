server:
  port: 8081
spring:
  application:
    name: ms-usuarios

  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=usuariosdb;encrypt=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: "crpp"

    # --- Configuracion de JPA / Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      # update: crea/ajusta las tablas si no existen, sin borrar datos entre reinicios.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      org.hibernate.SQL: debug