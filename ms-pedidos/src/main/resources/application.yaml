server:
  port: 8083
spring:
  application:
    name: ms-pedidos

  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=pedidosdb;encrypt=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: "crpp"

    # --- Configuracion de JPA / Hibernate ---
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      # update: crea/ajusta las tablas si no existen, sin borrar datos entre reinicios.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  logging:
    level:
      org.hibernate.SQL: debug

# URLs de los otros microservicios
services:
  usuarios:
    url: http://localhost:8081
  productos:
    url: http://localhost:8082